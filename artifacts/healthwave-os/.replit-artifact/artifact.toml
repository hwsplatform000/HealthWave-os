kind = "web"
previewPath = "/"
title = "HealthWave OS"
version = "1.0.0"
id = "artifacts/healthwave-os"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21176

[services.development]
run = "pnpm --filter @workspace/healthwave-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/healthwave-os", "run", "build" ]
serve = "static"
publicDir = "artifacts/healthwave-os/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21176"
BASE_PATH = "/"
